apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: minio

  sources:
    - repoURL: registry-1.docker.io/bitnamicharts
      chart: minio
      targetRevision: 17.0.21
      helm:
        releaseName: minio
        valueFiles:
          - $values/apps/minio/values.yaml

    - repoURL: https://github.com/ahsanhussain-max/aom-gitops-demo
      targetRevision: dev
      ref: values

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
