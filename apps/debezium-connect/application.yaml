apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: debezium-connect
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  source:
    repoURL: https://github.com/ahsanhussain-max/aom-gitops-demo
    targetRevision: dev
    path: apps/debezium-connect/manifests
    directory:
      recurse: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
