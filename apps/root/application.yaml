apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/ahsan-hussainn/aom-gitops
    targetRevision: dev
    path: apps
    directory:
      recurse: true
      include: '*/application.yaml'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
