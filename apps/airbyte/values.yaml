global:
  airbyteUrl: http://airbyte.local
  edition: community
  auth:
    enabled: false

# Airbyte 1.8 retired the standalone webapp; airbyte-server serves
# both API and UI on :8001. No image is published at airbyte/webapp:1.8.x.
webapp:
  enabled: false

worker:
  replicaCount: 1

server:
  replicaCount: 1

minio:
  storage:
    volumeClaimValue: 1Gi

postgresql:
  enabled: true
