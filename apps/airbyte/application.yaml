apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airbyte
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: airbyte

  sources:
    - repoURL: https://airbytehq.github.io/helm-charts
      chart: airbyte
      targetRevision: 1.8.5
      helm:
        releaseName: airbyte
        valueFiles:
          - $values/apps/airbyte/values.yaml

    - repoURL: https://github.com/ahsanhussain-max/aom-gitops-demo
      targetRevision: dev
      ref: values

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
