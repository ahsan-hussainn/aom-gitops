apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: airbyte
  namespace: airbyte
spec:
  ingressClassName: nginx
  rules:
  - host: airbyte.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: airbyte-airbyte-server-svc
            port:
              number: 8001
